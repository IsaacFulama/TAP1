name: CI/CD Pipeline

on:
  push:
    branches: [ main, codex/publish-project ]
  pull_request:
    branches: [ main, codex/publish-project ]

jobs:
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run unit tests
      run: |
        pytest tests/test_validators.py tests/test_auth.py -v --tb=short
    
    - name: Run performance tests
      run: |
        pytest tests/test_performance.py -v --tb=short
    
    - name: Run load tests
      run: |
        pytest tests/test_load.py -v --tb=short
    
    - name: Generate coverage report
      run: |
        pytest tests/ --cov=tap --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff flake8
    
    - name: Run ruff linter
      run: |
        ruff check tap/ tests/
    
    - name: Run flake8
      run: |
        flake8 tap/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run security checks
      run: |
        bandit -r tap/
        safety check --json
    
  build:
    name: Build Application
    runs-on: windows-latest
    needs: [test, lint, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name=TAP_Gestion_Loyers main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TAP_Gestion_Loyers
        path: dist/TAP_Gestion_Loyers.exe

  deploy:
    name: Deploy to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/publish-project'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: TAP_Gestion_Loyers
        path: ./dist
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.3.${{ github.run_number }}
        name: TAP Gestion des Loyers v3.3
        body: |
          ## Nouvelle version 3.3.${{ github.run_number }}
          
          ### Améliorations
          - Authentification sécurisée avec hashage scrypt
          - Gestion des tentatives avec verrouillage
          - Statuts automatiques des paiements
          - Interface responsive multi-écrans
          - Tests de performance et de charge
          - CI/CD automatisé
          
          ### Installation
          - Téléchargez l'exécutable
          - Suivez le guide d'installation
          
          ### Documentation
          - README_CLIENT.md pour les utilisateurs
          - INSTALLATION.md pour l'installation
        files: |
          dist/TAP_Gestion_Loyers.exe
          LIVRAISON_V3/init_database.sql
          LIVRAISON_V3/config.json
          LIVRAISON_V3/README_CLIENT.md
          LIVRAISON_V3/INSTALLATION.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
